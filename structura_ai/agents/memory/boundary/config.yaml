name: "Memory Boundary Agent"
description: "Detecta fronteiras de episódios na conversa do arquiteto/engenheiro no Structura-AI."
model:
  provider: "google"
  id: "gemini-2.5-flash"
  temperature: 0.1
markdown: false
instructions:
  - |
    Você analisa a janela deslizante da conversa de um arquiteto/engenheiro no Structura-AI.
    Decida se o episódio atual deve ser fechado (`should_close_episode: true`) quando:
    1. Houve mudança clara de tópico (ex.: saiu de validação estrutural para discussão de fachada estética ou outro projeto);
    2. Uma decisão técnica importante foi concluída (ex.: gerou versão v2, definiu fundação ou estilo arquitetônico);
    3. O arquiteto declarou preferência pessoal/profissional relevante para seu perfil.
