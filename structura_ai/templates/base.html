<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Structura.AI — Visualizador Estrutural{% endblock %}</title>

  <!-- Synchronous Theme Bootstrap (prevents flash & defaults to device theme) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('structura-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>

  <!-- 1. Design Tokens -->
  <link rel="stylesheet" href="/static/css/theme.css">

  <!-- Google Fonts (Inter & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN (with Typography plugin for Markdown rendering) -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f4f7fb',
              100: '#e6edf6',
              400: '#8ab0de',
              500: '#3b6ea8',
              600: '#1e4b85',
              700: '#173b69',
              800: '#122e52',
              900: '#0e233f',
              950: '#091628',
            },
            surface: {
              base: 'rgb(var(--surface-base) / <alpha-value>)',
              card: 'rgb(var(--surface-card) / <alpha-value>)',
              elevated: 'rgb(var(--surface-elevated) / <alpha-value>)',
              hover: 'rgb(var(--surface-hover) / <alpha-value>)',
              inset: 'rgb(var(--surface-inset) / <alpha-value>)',
            },
            ink: {
              strong: 'rgb(var(--ink-strong) / <alpha-value>)',
              primary: 'rgb(var(--ink-primary) / <alpha-value>)',
              secondary: 'rgb(var(--ink-secondary) / <alpha-value>)',
              muted: 'rgb(var(--ink-muted) / <alpha-value>)',
              faint: 'rgb(var(--ink-faint) / <alpha-value>)',
            },
            edge: {
              subtle: 'rgb(var(--edge-subtle) / <alpha-value>)',
              DEFAULT: 'rgb(var(--edge-default) / <alpha-value>)',
              strong: 'rgb(var(--edge-strong) / <alpha-value>)',
            },
            accent: {
              brand: 'rgb(var(--accent-brand) / <alpha-value>)',
              sky: 'rgb(var(--accent-sky) / <alpha-value>)',
              emerald: 'rgb(var(--accent-emerald) / <alpha-value>)',
              amber: 'rgb(var(--accent-amber) / <alpha-value>)',
              rose: 'rgb(var(--accent-rose) / <alpha-value>)',
              indigo: 'rgb(var(--accent-indigo) / <alpha-value>)',
              purple: 'rgb(var(--accent-purple) / <alpha-value>)',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"JetBrainsMono Nerd Font"', '"Noto Sans Mono"', '"Liberation Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 2. Reusable UI Primitives & 3. Specialized Interactive Controls -->
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/custom.css">

  <!-- Theme Controller -->
  <script src="/static/js/theme.js" defer></script>
</head>
<body class="bg-surface-base text-ink-primary min-h-screen flex flex-col font-sans antialiased selection:bg-ink-strong selection:text-surface-card transition-colors duration-150">

  {% include "partials/navbar.html" %}

  <main class="flex-1 flex flex-col">
    {% block content %}{% endblock %}
  </main>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
