version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: structura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: structura_user
      POSTGRES_PASSWORD: structura_secure_pass_2026
      POSTGRES_DB: structura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structura_user -d structura_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: structura_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://structura_user:structura_secure_pass_2026@db:5432/structura_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.0-flash
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
