[project]
name = "structura-ai"
version = "2.0.0"
description = "Copiloto Estrutural & Arquitetônico com Agno Agents, RAG Normativo e Versionamento CAD/BIM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.3.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.2",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "ezdxf>=1.3.0",
    "trimesh>=4.4.0",
    "shapely>=2.0.0",
    "ifcopenshell>=0.8.0",
    "jinja2>=3.1.4",
    "beautifulsoup4>=4.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
